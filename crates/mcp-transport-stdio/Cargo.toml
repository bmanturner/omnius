[package]
name = "omnius-mcp-transport-stdio"
description = "Bounded stateless MCP JSON-RPC transport over process stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
omnius-mcp-server-core = { path = "../mcp-server-core", version = "=0.1.0" }
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server", "elicitation", "request-state"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util.workspace = true

[dev-dependencies]
omnius-agent-capability-registry.workspace = true
omnius-auth-core.workspace = true
omnius-authz-basic.workspace = true
omnius-core.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
