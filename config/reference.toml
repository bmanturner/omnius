# Placeholder-shaped strings are illustrative fail-closed sentinels, not interpolation syntax.
# Runtime configuration must replace them with resolved values through supported layers.
[telemetry]
service = "api-reference"
version = "0.3.0"
environment = "development"
filter = "info"
format = "pretty"
prometheus = false

[server]
listen_address = "127.0.0.1:8080"
listener_shutdown_timeout = "10s"
telemetry_flush_timeout = "2s"

[http]
max_body_bytes = 2097152
max_header_bytes = 65536
max_header_count = 100
max_in_flight = 1024
header_read_timeout = "5s"
handler_timeout = "30s"
trusted_origins = ["http://localhost:5173"]

[static_delivery]
asset_dir = "web/dist"
base_path = "/"
fallback = "spa"
production_required = true
source_maps = "disabled"

[static_delivery.security.hsts]
# Set to "trusted" only when the public origin is always behind an administered TLS boundary.
boundary = "none"

[static_delivery.security.content_security_policy]
connect_src = ["'self'"]

[static_delivery.precompressed]
gzip = true
brotli = true
zstd = true

[health]
refresh_interval = "5s"
stale_after = "15s"
shutdown_timeout = "1s"

[postgres]
url = "${POSTGRES_URL}"
tls_mode = "verify-full"
min_connections = 1
max_connections = 10
connect_timeout = "10s"
acquire_timeout = "5s"
idle_timeout = "10m"
max_lifetime = "30m"
max_lifetime_jitter = "5m"
application_name = "api-reference"
initialization_sql = ["SET search_path TO public"]
statement_timeout = "15s"
lock_timeout = "3s"
health_timeout = "6s"
shutdown_timeout = "10s"

[postgres.transaction_retry]
max_attempts = 3
base_delay = "25ms"
max_delay = "1s"
max_jitter = "100ms"
isolation = "serializable"

[idempotency]
enabled = true
ttl = "24h"
max_response_bytes = 65536

[pagination]
# Exactly 32 secret bytes after environment expansion.
cursor_signing_key = "${CURSOR_SIGNING_KEY}"

[openapi]
document_route_enabled = true
docs_route_enabled = true
max_document_bytes = 4194304

[outbound_http]
connect_timeout = "5s"
total_timeout = "30s"
response_body_limit_bytes = 2097152
max_redirects = 5
user_agent = "api-reference/0.3.0"

[outbound_http.proxy]
mode = "disabled"


[migrations]
# Production must keep this false and use the dedicated migrate command.
run_on_startup = false
operation_timeout = "15m"

[auth.session]
enabled = true
store = "postgres"
cookie_name = "__Host-omnius_session"
secure = true
http_only = true
same_site = "lax"
idle_timeout = "12h"
absolute_timeout = "30d"

[auth.password]
login_provider = "email"
max_concurrency = 2

[auth.password.policy]
memory_kib = 19456
iterations = 2
parallelism = 1
min_password_bytes = 12
max_password_bytes = 1024
recovery_ttl = "15m"
verification_ttl = "24h"

[auth.password.pepper]
version = 1
secret = "${PASSWORD_PEPPER}"

[auth.registration]
# Production requires an explicit mode and an HTTPS public application URL.
mode = "invite_only"
local_identity_provider = "email"
invitation_ttl = "7d"
public_app_url = "${PUBLIC_APP_URL}"
# Canonical unpadded base64url encoding of exactly 32 secret bytes.
invitation_token_pepper = "${REGISTRATION_INVITATION_PEPPER}"
response_floor = "500ms"
[auth.api_key]
enabled = true
# Canonical unpadded base64url encoding of exactly 32 secret bytes.
pepper = "${API_KEY_PEPPER}"
max_scopes = 32
max_key_lifetime = "90d"
last_used_write_interval = "5m"


[auth.authorization_server]
enabled = true
issuer = "${OAUTH_ISSUER}"
token_pepper = "${OAUTH_TOKEN_PEPPER}"
authorization_request_ttl = "10m"
authorization_code_ttl = "2m"
access_token_ttl = "10m"
id_token_ttl = "10m"
refresh_token_ttl = "30d"
client_metadata_cache_ttl = "15m"
max_authorization_request_bytes = 16384
max_client_metadata_bytes = 65536
dynamic_client_registration = false

# A runtime environment layer must replace this complete array with resolved absolute resource URIs.
[[auth.authorization_server.resources]]
uri = "${OAUTH_ISSUER}"
name = "Omnius API"
description = "The first-party Omnius HTTP API."
minimum_assurance = "aal1"

[[auth.authorization_server.resources.scopes]]
name = "api:read"
description = "Read authenticated API resources."

[[auth.authorization_server.resources]]
uri = "${OAUTH_MCP_RESOURCE}"
name = "Omnius MCP"
description = "The dedicated reference-record MCP resource."
minimum_assurance = "aal1"

[[auth.authorization_server.resources.scopes]]
name = "reference-records:read"
description = "Read reference records through MCP."

[[auth.authorization_server.signing_keys]]
kid = "reference-active"
algorithm = "RS256"
state = "active"
public_jwk = { kty = "RSA", use = "sig", key_ops = ["verify"], alg = "RS256", kid = "reference-active", n = "${OAUTH_SIGNING_JWK_N}", e = "AQAB" }
private_key_pkcs8_pem = '''${OAUTH_SIGNING_PRIVATE_KEY_PKCS8_PEM}'''

[auth.oauth_rate_limit.authorize]
replenish_every = "100ms"
burst_size = 60
identity_buckets = 65536

[auth.oauth_rate_limit.token]
replenish_every = "250ms"
burst_size = 30
identity_buckets = 65536

[auth.oauth_rate_limit.register]
replenish_every = "1s"
burst_size = 5
identity_buckets = 16384

[auth.oauth_rate_limit.revoke]
replenish_every = "250ms"
burst_size = 30
identity_buckets = 65536

[auth.jwt]
enabled = false
audiences = ["omnius-api"]
algorithms = ["RS256"]
token_types = ["at+jwt"]
clock_skew = "30s"
cache_ttl = "15m"
min_refresh_interval = "30s"
max_token_lifetime = "1h"
max_token_bytes = 16384
max_jwks_bytes = 262144
max_keys_per_issuer = 64
max_kid_bytes = 128

[email.from]
address = "accounts@example.test"
display_name = "Omnius"

[email.provider]
# Capturing is accepted only when --environment test is explicitly selected.
provider = "smtp"
relay = "${SMTP_RELAY}"
port = 465
tls = "implicit"
username = "${SMTP_USERNAME}"
password = "${SMTP_PASSWORD}"

[email.templates]
# Must resolve to an existing absolute directory containing the three checked-in pairs.
directory = "${EMAIL_TEMPLATE_DIR}"
allowed_templates = [
  "account-email-verification",
  "account-password-recovery",
  "account-registration-invitation",
]

[tenancy]
enabled = true
max_list_items = 100
