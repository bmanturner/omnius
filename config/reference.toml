# Checked-in values are non-secret or explicit injection placeholders.
[telemetry]
service = "api-reference"
version = "0.1.0"
environment = "development"
filter = "info"
format = "pretty"
prometheus = false

[server]
listen_address = "127.0.0.1:8080"
listener_shutdown_timeout = "10s"
telemetry_flush_timeout = "2s"

[http]
max_body_bytes = 2097152
max_header_bytes = 65536
max_header_count = 100
max_in_flight = 1024
header_read_timeout = "5s"
handler_timeout = "30s"
trusted_origins = ["http://localhost:5173"]

[static_delivery]
asset_dir = "web/dist"
base_path = "/"
fallback = "spa"
production_required = true
source_maps = "disabled"

[static_delivery.security.hsts]
# Set to "trusted" only when the public origin is always behind an administered TLS boundary.
boundary = "none"

[static_delivery.precompressed]
gzip = true
brotli = true
zstd = true

[health]
refresh_interval = "5s"
stale_after = "15s"
shutdown_timeout = "1s"

[postgres]
url = "${POSTGRES_URL}"
tls_mode = "verify-full"
min_connections = 1
max_connections = 10
connect_timeout = "10s"
acquire_timeout = "5s"
idle_timeout = "10m"
max_lifetime = "30m"
max_lifetime_jitter = "5m"
application_name = "api-reference"
initialization_sql = ["SET search_path TO public"]
statement_timeout = "15s"
lock_timeout = "3s"
health_timeout = "6s"
shutdown_timeout = "10s"

[postgres.transaction_retry]
max_attempts = 3
base_delay = "25ms"
max_delay = "1s"
max_jitter = "100ms"
isolation = "serializable"

[idempotency]
enabled = true
ttl = "24h"
max_response_bytes = 65536

[pagination]
# Exactly 32 secret bytes after environment expansion.
cursor_signing_key = "${CURSOR_SIGNING_KEY}"

[openapi]
document_route_enabled = true
docs_route_enabled = true
max_document_bytes = 4194304

[outbound_http]
connect_timeout = "5s"
total_timeout = "30s"
response_body_limit_bytes = 2097152
max_redirects = 5
user_agent = "api-reference/0.1.0"

[outbound_http.proxy]
mode = "disabled"

[webhooks_inbound]
enabled = false
max_body_bytes = 1048576
max_header_count = 64
max_header_bytes = 32768
max_safe_payload_bytes = 131072
retention = "30d"
fixture_hmac_providers = []

[webhooks_inbound.processing]
batch_size = 32
max_attempts = 8
lease_duration = "60s"
handler_timeout = "30s"
poll_interval = "1s"
retry_base_delay = "2s"
retry_max_delay = "5m"
cleanup_batch_size = 100
shutdown_timeout = "10s"

[migrations]
# Production must keep this false and use the dedicated migrate command.
run_on_startup = false
operation_timeout = "15m"

[auth.session]
enabled = true
store = "postgres"
cookie_name = "__Host-omnius_session"
secure = true
http_only = true
same_site = "lax"
idle_timeout = "12h"
absolute_timeout = "30d"

[auth.password]
login_provider = "email"
max_concurrency = 2

[auth.password.policy]
memory_kib = 19456
iterations = 2
parallelism = 1
min_password_bytes = 12
max_password_bytes = 1024
recovery_ttl = "15m"
verification_ttl = "24h"

[auth.password.pepper]
version = 1
secret = "${PASSWORD_PEPPER}"

[auth.jwt]
enabled = true
audiences = ["omnius-api"]
algorithms = ["RS256"]
token_types = ["at+jwt"]
clock_skew = "30s"
cache_ttl = "15m"
min_refresh_interval = "30s"
max_token_lifetime = "1h"
max_token_bytes = 16384
max_jwks_bytes = 262144
max_keys_per_issuer = 64
max_kid_bytes = 128

[[auth.jwt.issuers]]
issuer = "https://issuer.example.test"
jwks_url = "https://issuer.example.test/.well-known/jwks.json"

[realtime]
# Exact canonical browser origins; wildcards, paths, and trailing slashes are rejected.
trusted_origins = ["http://localhost:5173"]

[tenancy]
enabled = true
max_list_items = 100

[object_storage]
[object_storage.provider]
provider = "s3-compatible"
endpoint = "https://93.184.216.34"
region = "us-east-1"
bucket = "omnius-uploads"
access_key_id = "${OBJECT_STORAGE_ACCESS_KEY_ID}"
secret_access_key = "${OBJECT_STORAGE_SECRET_ACCESS_KEY}"
allow_http = false

[object_storage.limits]
max_object_size = 5368709120
multipart_part_size = 8388608
max_multipart_parts = 10000
max_metadata_fields = 32
max_metadata_key_bytes = 128
max_metadata_value_bytes = 1024
max_metadata_bytes = 16384
max_list_page_size = 1000
operation_timeout = "30s"
connect_timeout = "5s"
max_signed_url_expiry = "5m"
max_retries = 3
retry_timeout = "10s"

[uploads.scanner]
address = "127.0.0.1:3310"
connect_timeout = "5s"
io_timeout = "30s"

[uploads.reconciler]
lease_owner = "api-reference"
claim_batch = 4
lease_duration = "60s"
work_timeout = "30s"
finalization_margin = "5s"
poll_interval = "1s"
max_attempts = 8
initial_retry = "2s"
max_retry = "5m"
orphan_grace = "1h"

[uploads.policy]
direct_upload_expires_in = "5m"
pending_upload_ttl = "30m"
