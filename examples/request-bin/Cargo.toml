[workspace]
resolver = "3"
members = ["apps/service"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["json"] }
base64 = "=0.23.1"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.11.0"
subtle = "=2.6.1"
time = { version = "=0.3.55", features = ["formatting"] }
clap = { version = "=4.6.6", features = ["derive"] }
garde = { version = "=0.23.0", features = ["derive"] }
humantime-serde = "=1.1.1"
http-body-util = "=0.1.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
thiserror = "=2.0.20"
toml = "=1.1.4"
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
# omnius:managed-begin id=framework-dependency version=1 hash=3f05b7977e06adca536ca5c93d9f128c74959de3e1f9f2156d967548c3a707c2
[workspace.dependencies.service-kit]
package = "omnius-service-kit"
version = "=0.3.0"
git = "https://github.com/bmanturner/omnius.git"
rev = "3427e28950a258acb0cf7fec1a7b3780e5c2fbed"
default-features = false
features = [
  "core",
  "config",
  "telemetry",
  "runtime",
  "http",
  "health",
  "validation",
  "openapi",
  "rate-limit-local",
]
# omnius:managed-end id=framework-dependency

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
