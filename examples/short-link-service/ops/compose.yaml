services:
  app:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    environment:
      OMNIUS__MIGRATIONS__RUN_ON_STARTUP: "false"
      OMNIUS__POSTGRES__URL: "postgres://omnius:omnius-development-only@postgres:5432/omnius"
      OMNIUS__SERVER__LISTEN_ADDRESS: "0.0.0.0:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
    - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
    - /tmp:size=16m,mode=1777
    security_opt:
    - no-new-privileges:true
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    command: ["migrate"]
    environment:
      OMNIUS__MIGRATIONS__RUN_ON_STARTUP: "false"
      OMNIUS__POSTGRES__URL: "postgres://omnius:omnius-development-only@postgres:5432/omnius"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
    - /tmp:size=16m,mode=1777
    security_opt:
    - no-new-privileges:true
  postgres:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: "omnius"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      POSTGRES_PASSWORD: "omnius-development-only"
      POSTGRES_USER: "omnius"
    volumes:
    - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnius -d omnius"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
