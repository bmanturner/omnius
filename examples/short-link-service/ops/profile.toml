schema_version = 1
profile = "api"
local_only = true
external_provider_calls = false

[lifecycle]
profile_info = "cargo run --locked -p short-link-service -- profile-info"
start = "cargo run --locked -p short-link-service -- server"
readiness = "GET http://127.0.0.1:${PORT}/ready"
version = "GET http://127.0.0.1:${PORT}/version"
liveness = "GET http://127.0.0.1:${PORT}/live"
drain_signal = "SIGTERM"
timeout_seconds = 30

[rust]
compile = "cargo test --locked --no-run"
test = "cargo test --locked"

