[workspace]
resolver = "3"
members = ["apps/api-server", "apps/server", "compat/phase0", "crates/auth-api-key", "crates/auth-core", "crates/auth-jwt", "crates/auth-oidc", "crates/auth-password", "crates/auth-session-postgres", "crates/config", "crates/core", "crates/health", "crates/http", "crates/idempotency", "crates/migrations", "crates/openapi", "crates/outbound-http", "crates/pagination", "crates/postgres", "crates/reference-domain", "crates/reference-postgres", "crates/runtime", "crates/telemetry", "crates/test-support", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "=1.0.104"
argon2 = { version = "=0.5.3", default-features = false, features = ["std", "zeroize"] }
apalis = { version = "=0.7.4", default-features = false }
apalis-redis = { version = "=0.7.4", default-features = false }
axum = { version = "=0.8.9", features = ["json", "query", "ws", "multipart"] }
axum-login = "=0.18.0"
base64 = "=0.22.1"
clap = { version = "=4.6.6", features = ["derive"] }
config = { version = "=0.15.25", default-features = false, features = ["toml"] }
csv = "=1.4.0"
fred = { version = "=10.1.0", default-features = false, features = ["enable-rustls-ring"] }
futures = "=0.3.34"
garde = { version = "=0.23.0", features = ["derive"] }
hmac = "=0.12.1"
hyper = { version = "=1.11.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "=0.1.20", features = ["http1", "http2", "server-auto", "service", "tokio"] }
humantime-serde = "=1.1.1"
jsonschema = { version = "=0.51.0", default-features = false }
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
metrics = "=0.24.6"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
oauth2 = { version = "=5.0.0", default-features = false }
openidconnect = { version = "=4.0.1", default-features = false }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["grpc-tonic", "trace", "metrics", "tls-ring", "tls-webpki-roots"] }
opentelemetry-semantic-conventions = "=0.32.0"
opentelemetry_sdk = { version = "=0.32.0", default-features = false, features = ["rt-tokio", "trace", "metrics"] }
pgmq = { version = "=0.33.7", default-features = false, features = ["install-sql-embedded"] }
password-hash = { version = "=0.5.0", default-features = false, features = ["alloc", "rand_core"] }
proptest = "=1.9.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
redis = { version = "=1.6.0", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
redis-apalis = { package = "redis", version = "=0.32.7", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls-no-provider", "gzip", "brotli", "zstd"] }
regex = "=1.13.1"
rsk-api-server = { path = "apps/api-server", version = "=0.1.0" }
rsk-auth-api-key = { path = "crates/auth-api-key", version = "=0.1.0" }
rsk-auth-core = { path = "crates/auth-core", version = "=0.1.0" }
rsk-auth-jwt = { path = "crates/auth-jwt", version = "=0.1.0" }
rsk-auth-oidc = { path = "crates/auth-oidc", version = "=0.1.0" }
rsk-auth-password = { path = "crates/auth-password", version = "=0.1.0" }
rsk-auth-session-postgres = { path = "crates/auth-session-postgres", version = "=0.1.0" }
rsk-config = { path = "crates/config", version = "=0.1.0" }
rsk-core = { path = "crates/core", version = "=0.1.0" }
rsk-health = { path = "crates/health", version = "=0.1.0" }
rsk-http = { path = "crates/http", version = "=0.1.0" }
rsk-idempotency = { path = "crates/idempotency", version = "=0.1.0" }
rsk-migrations = { path = "crates/migrations", version = "=0.1.0" }
rsk-openapi = { path = "crates/openapi", version = "=0.1.0" }
rsk-outbound-http = { path = "crates/outbound-http", version = "=0.1.0" }
rsk-pagination = { path = "crates/pagination", version = "=0.1.0" }
rsk-postgres = { path = "crates/postgres", version = "=0.1.0" }
rsk-reference-domain = { path = "crates/reference-domain", version = "=0.1.0" }
rsk-reference-postgres = { path = "crates/reference-postgres", version = "=0.1.0" }
rsk-runtime = { path = "crates/runtime", version = "=0.1.0" }
rsk-telemetry = { path = "crates/telemetry", version = "=0.1.0" }
rsk-test-support = { path = "crates/test-support", version = "=0.1.0" }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
secrecy = { version = "=0.10.3", features = ["serde"] }
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "json", "time", "uuid"] }
testcontainers = { version = "=0.28.0", default-features = false, features = ["ring"] }
tower-sessions = { version = "=0.14.0", default-features = false }
tower-sessions-redis-store = { version = "=0.16.0", default-features = false }
tower-sessions-sqlx-store = { version = "=0.15.0", default-features = false, features = ["postgres"] }
thiserror = "=2.0.20"
toml = "=1.1.4"
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "=0.14.6", default-features = false }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tower = { version = "=0.5.3", features = ["util", "timeout", "limit", "load-shed", "retry", "buffer"] }
tower-http = { version = "=0.7.0", features = ["catch-panic", "compression-br", "compression-gzip", "compression-zstd", "cors", "csrf", "limit", "normalize-path", "request-id", "sensitive-headers", "set-header", "timeout", "trace", "validate-request"] }
tracing = "=0.1.44"
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "=5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "=9.0.2", default-features = false, features = ["axum", "vendored"] }
uuid = { version = "=1.25.0", features = ["serde", "v7"] }
url = { version = "=2.5.8", features = ["serde"] }
webpki-roots = "=1.0.9"
walkdir = "=2.5.0"
wiremock = "=0.6.5"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
