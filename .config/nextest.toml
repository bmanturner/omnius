[store]
dir = "target/nextest"

[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci.junit]
path = "target/nextest/ci/junit.xml"

[test-groups]
process-integration = { max-threads = 2 }
postgres-integration = { max-threads = 2 }
redis-integration = { max-threads = 2 }
nats-integration = { max-threads = 2 }
minio-integration = { max-threads = 2 }
provider-contract = { max-threads = 4 }
jobs-contract = { max-threads = 4 }

[[profile.default.overrides]]
filter = "package(rsk-jobs-core)"
test-group = "jobs-contract"
slow-timeout = { period = "15s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "package(rsk-jobs-apalis-redis)"
test-group = "redis-integration"
slow-timeout = { period = "90s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "package(rsk-jobs-pgmq)"
test-group = "postgres-integration"
slow-timeout = { period = "90s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "package(rsk-minimal-server) & binary(minimal_service)"
test-group = "process-integration"
slow-timeout = { period = "15s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "package(rsk-test-support) & test(/postgres_container/)"
test-group = "postgres-integration"
slow-timeout = { period = "90s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "package(rsk-postgres) & test(/postgres_pool/)"
