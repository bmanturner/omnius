[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
all-features = true

# Dependency-policy note: serde_yaml =0.9.34 is deprecated upstream and pinned in the
# workspace Cargo.toml; it is used at runtime by omnius-mcp-skills (package.rs) and
# omnius-generator (catalog.rs). Replacement trigger: the first RustSec advisory (or
# unmaintained notice) naming serde_yaml, or any dependency/toolchain bump that breaks the
# pinned 0.9.34 build. At that point choose a maintained YAML parser and swap it in the two
# parsers above. Until then the pin stays.

[advisories]
ignore = ["RUSTSEC-2023-0071"]

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "PostgreSQL",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

# Every duplicate line is explicit and remains visible in `cargo tree -d` review.
# Remove an exception when its upstream compatibility constraint disappears.
skip = [
  { crate = "base64@0.21.7", reason = "ADR-0015 OpenID Connect compatibility line; remove when openidconnect/oauth2 move to base64 0.23 (workspace line)" },
  { crate = "base64@0.23.1", reason = "Workspace direct dependency and Lettre 0.11 MIME compatibility line; remove when the other base64 users (see base64@0.21.7) converge on 0.23" },
  { crate = "block-buffer@0.12.1", reason = "Swagger UI rust-embed SHA-2 0.11 compatibility line; remove when rust-embed's sha2 matches the workspace sha2 version" },
  { crate = "core-foundation@0.9.4", reason = "Hickory 0.26 macOS system DNS compatibility line; remove when hickory moves to core-foundation 0.10" },
  { crate = "const-oid@0.9.6", reason = "ADR-0015 OpenID Connect signature verification compatibility line; remove when openidconnect moves to const-oid 0.10" },
  { crate = "crypto-common@0.2.2", reason = "Swagger UI rust-embed SHA-2 0.11 compatibility line; remove when rust-embed's sha2 matches the workspace sha2 version" },
  { crate = "convert_case@0.11.0", reason = "OMNIUS-ADR-0015 Rig Bedrock derive compatibility line; remove when rig's derive crate moves to the workspace convert_case version" },
  { crate = "digest@0.11.3", reason = "Swagger UI rust-embed SHA-2 0.11 compatibility line; remove when rust-embed's sha2 matches the workspace sha2 version" },
  { crate = "cpufeatures@0.3.0", reason = "Testcontainers/Bollard rand 0.10 compatibility line; remove when testcontainers/bollard move off rand 0.10" },
  { crate = "darling@0.20.11", reason = "Croner 3 derive-builder compatibility line; remove when croner/derive_builder move to darling 0.23" },
  { crate = "darling_core@0.20.11", reason = "Croner 3 derive-builder compatibility line; remove when croner/derive_builder move to darling 0.23" },
  { crate = "darling_macro@0.20.11", reason = "Croner 3 derive-builder compatibility line; remove when croner/derive_builder move to darling 0.23" },
  { crate = "foldhash@0.1.5", reason = "SQLx 0.8 hashbrown compatibility line; remove when sqlx moves to hashbrown 0.16 (foldhash 0.2)" },
  { crate = "getrandom@0.2.17", reason = "rand 0.8/ring compatibility line; remove when rand 0.8 users (see rand@0.8.8) and ring move to getrandom 0.3+" },
  { crate = "getrandom@0.3.4", reason = "rand 0.9 compatibility line; remove when the rand 0.9 users move to getrandom 0.4" },
  { crate = "hashbrown@0.14.5", reason = "governor 0.10 keyed-store compatibility line; remove when governor moves to hashbrown 0.16" },
  { crate = "hashbrown@0.15.5", reason = "SQLx 0.8 compatibility line; remove when sqlx moves to hashbrown 0.16" },
  { crate = "hashbrown@0.16.1", reason = "metrics exporter compatibility line; remove when the other hashbrown users converge on 0.16" },
  { crate = "hmac@0.13.0", reason = "TOTP 6 security baseline compatibility line; remove when the other hmac users move to 0.13" },
  { crate = "http@0.2.12", reason = "OMNIUS-ADR-0015 optional AWS Bedrock SDK compatibility line; remove when the AWS SDK moves to http 1" },
  { crate = "http-body@0.4.6", reason = "OMNIUS-ADR-0015 optional AWS Bedrock SDK compatibility line; remove when the AWS SDK moves to http-body 1" },
  { crate = "itertools@0.10.5", reason = "ADR-0015 OpenID Connect compatibility line; remove when openidconnect moves to itertools 0.15" },
  { crate = "jsonwebtoken@10.4.0", reason = "Meilisearch SDK 0.33 compatibility line; remove when meilisearch-sdk moves to jsonwebtoken 11" },
  { crate = "itertools@0.15.0", reason = "Cedar 4.12 policy engine compatibility line; remove when the other itertools users converge on 0.15" },
  { crate = "md-5@0.10.6", reason = "SQLx 0.8 compatibility line; remove when sqlx-postgres moves to md-5 0.11" },
  { crate = "nom@8.0.0", reason = "Lettre 0.11 SMTP parser compatibility line; remove when lettre moves to the nom version used by the other parsers" },
  { crate = "nonempty@0.7.0", reason = "tower-governor 0.8 forwarded-header compatibility line; remove when tower-governor moves to nonempty 0.12" },
  { crate = "ordered-float@5.5.0", reason = "OMNIUS-ADR-0015 Rig provider normalization compatibility line; remove when rig moves to the workspace ordered-float version" },
  { crate = "pastey@0.2.3", reason = "OMNIUS-ADR-0019 official RMCP server macro compatibility line; remove when rmcp-macros moves to the workspace pastey version" },
  { crate = "phf_shared@0.12.1", reason = "chrono-tz 0.10 IANA timezone compatibility line; remove when the other phf_shared users (0.11.3) move to 0.12 or chrono-tz drops it" },
  { crate = "rand@0.10.2", reason = "Testcontainers/Bollard compatibility line; remove when testcontainers/bollard move to the workspace rand version" },
  { crate = "reqwest@0.12.28", reason = "Meilisearch SDK 0.33 compatibility line; remove when meilisearch-sdk moves to reqwest 0.13" },
  { crate = "rand@0.8.8", reason = "rand 0.8 users sqlx-postgres 0.8, openidconnect 4, oauth2 5, tower-sessions-core 0.14, fred 10 and nkeys 0.4; fred 10 comes via tower-sessions-redis-store 0.16 (crates/auth-session-redis); remove when all of these move to rand 0.9+ and the session store moves to the workspace redis client" },
  { crate = "rand_chacha@0.3.1", reason = "rand 0.8 companion (rand 0.8.8 users: sqlx-postgres, openidconnect, oauth2, tower-sessions-core, fred, nkeys); remove with rand@0.8.8" },
  { crate = "rand_core@0.6.4", reason = "rand 0.8 companion plus RustCrypto 0.x traits (elliptic-curve, crypto-bigint, ff, group) used by the auth crates; remove with rand@0.8.8 and when those RustCrypto crates move to rand_core 0.10" },
  { crate = "rand_core@0.10.1", reason = "Testcontainers/Bollard rand 0.10 compatibility line; remove when testcontainers/bollard move to the workspace rand version" },
  { crate = "redis@0.32.7", reason = "ADR-0011 Apalis provider isolation; remove when apalis-redis and omnius-jobs-apalis-redis move to redis 1.6" },
  { crate = "sha1@0.11.0", reason = "TOTP 6 RFC 6238 compatibility line; remove when the other sha1 users move to 0.11" },
  { crate = "sha2@0.11.0", reason = "Swagger UI rust-embed asset hashing compatibility line; remove when rust-embed's sha2 matches the workspace sha2 version" },
  { crate = "socket2@0.5.10", reason = "fred 10 via tower-sessions-redis-store 0.16 (crates/auth-session-redis); remove when the session store moves to the workspace redis client" },
  { crate = "spin@0.9.9", reason = "Parents flume 0.11.1, lazy_static 1.5.0 and multer 3.1.0 (spin 0.10 is used by crc-fast 1.10.0); remove when they move to spin 0.10" },
  { crate = "strum@0.27.2", reason = "Croner 3 expression evaluator compatibility line; remove when croner moves to strum 0.28" },
  { crate = "strum_macros@0.27.2", reason = "Croner 3 expression evaluator compatibility line; remove when croner moves to strum 0.28" },
  { crate = "syn@2.0.119", reason = "syn 2 is still used by derive crates such as sqlx-macros, utoipa-gen, rig-derive, garde_derive, fred-macros and darling 0.20/0.23, while serde_derive, tokio-macros and clap_derive use syn 3; remove when those macro crates move to syn 3" },
  { crate = "thiserror@1.0.69", reason = "PGMQ and session store compatibility line (pgmq 0.33, tower-sessions-sqlx-store 0.15, oauth2 5, openidconnect 4, webauthn-rs-core, x509-parser 0.16); remove when they move to thiserror 2" },
  { crate = "thiserror-impl@1.0.69", reason = "thiserror 1 compatibility line; remove with thiserror@1.0.69" },
  { crate = "tower-http@0.6.11", reason = "reqwest 0.13 internal compatibility line; remove when reqwest 0.13 moves to tower-http 0.7" },
  { crate = "unicode-width@0.1.14", reason = "Cedar 4.12 miette diagnostics compatibility line; remove when miette moves to unicode-width 0.2" },
  { crate = "untrusted@0.7.1", reason = "jsonwebtoken AWS-LC verification backend compatibility line; remove when the other untrusted users move to 0.9" },
  { crate = "webpki-roots@0.26.11", reason = "SQLx 0.8 internal compatibility line; remove when sqlx moves to webpki-roots 1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
