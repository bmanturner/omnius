[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
ignore = ["RUSTSEC-2023-0071"]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "PostgreSQL",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

# Every duplicate line is explicit and remains visible in `cargo tree -d` review.
# Remove an exception when its upstream compatibility constraint disappears.
skip = [
  { crate = "base64@0.21.7", reason = "ADR-0015 OpenID Connect compatibility line" },
  { crate = "block-buffer@0.12.1", reason = "Swagger UI rust-embed SHA-2 0.11 compatibility line" },
  { crate = "const-oid@0.9.6", reason = "ADR-0015 OpenID Connect signature verification compatibility line" },
  { crate = "crypto-common@0.2.2", reason = "Swagger UI rust-embed SHA-2 0.11 compatibility line" },
  { crate = "digest@0.11.3", reason = "Swagger UI rust-embed SHA-2 0.11 compatibility line" },
  { crate = "cpufeatures@0.3.0", reason = "Testcontainers/Bollard rand 0.10 compatibility line" },
  { crate = "foldhash@0.1.5", reason = "SQLx 0.8 hashbrown compatibility line" },
  { crate = "getrandom@0.2.17", reason = "rand 0.8/ring compatibility line" },
  { crate = "getrandom@0.3.4", reason = "rand 0.9 compatibility line" },
  { crate = "hashbrown@0.15.5", reason = "SQLx 0.8 compatibility line" },
  { crate = "hashbrown@0.16.1", reason = "metrics exporter compatibility line" },
  { crate = "hmac@0.13.0", reason = "TOTP 6 security baseline compatibility line" },
  { crate = "itertools@0.10.5", reason = "ADR-0015 OpenID Connect compatibility line" },
  { crate = "rand@0.10.2", reason = "Testcontainers/Bollard compatibility line" },
  { crate = "rand@0.8.7", reason = "SQLx/session compatibility line" },
  { crate = "rand_chacha@0.3.1", reason = "rand 0.8 compatibility line" },
  { crate = "rand_core@0.6.4", reason = "rand 0.8 compatibility line" },
  { crate = "rand_core@0.10.1", reason = "Testcontainers/Bollard rand 0.10 compatibility line" },
  { crate = "redis@0.32.7", reason = "ADR-0011 Apalis provider isolation" },
  { crate = "sha1@0.11.0", reason = "TOTP 6 RFC 6238 compatibility line" },
  { crate = "sha2@0.11.0", reason = "Swagger UI rust-embed asset hashing compatibility line" },
  { crate = "socket2@0.5.10", reason = "fred 10 compatibility line" },
  { crate = "syn@2.0.119", reason = "proc-macro ecosystem transition" },
  { crate = "thiserror@1.0.69", reason = "PGMQ and session store compatibility line" },
  { crate = "thiserror-impl@1.0.69", reason = "thiserror 1 compatibility line" },
  { crate = "tower-http@0.6.11", reason = "reqwest 0.13 internal compatibility line" },
  { crate = "untrusted@0.7.1", reason = "jsonwebtoken AWS-LC verification backend compatibility line" },
  { crate = "webpki-roots@0.26.11", reason = "SQLx 0.8 internal compatibility line" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
