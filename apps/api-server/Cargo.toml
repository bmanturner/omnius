[package]
name = "omnius-api-server"
description = "Reference Axum API profile and deterministic OpenAPI catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "omnius-api-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
axum-login.workspace = true
clap.workspace = true
garde.workspace = true
hyper-util.workspace = true
humantime-serde.workspace = true
omnius-auth-core.workspace = true
omnius-auth-jwt.workspace = true
omnius-auth-session-postgres.workspace = true
omnius-config.workspace = true
omnius-core.workspace = true
omnius-health.workspace = true
omnius-http.workspace = true
omnius-idempotency.workspace = true
omnius-migrations.workspace = true
omnius-openapi.workspace = true
omnius-outbound-http.workspace = true
omnius-pagination.workspace = true
omnius-postgres.workspace = true
omnius-reference-domain.workspace = true
omnius-reference-postgres.workspace = true
omnius-runtime.workspace = true
omnius-telemetry.workspace = true
omnius-webhooks-inbound.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
utoipa = { workspace = true, features = ["macros", "uuid"] }

[dev-dependencies]
jsonwebtoken.workspace = true
omnius-auth-core = { workspace = true, features = ["test-support"] }
omnius-test-support.workspace = true
tower-sessions.workspace = true
tower.workspace = true
uuid.workspace = true

[lints]
workspace = true
