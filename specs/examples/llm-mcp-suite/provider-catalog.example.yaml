providers:
- id: openai
  adapter_module: llm-provider-rig
  protocol_family: OpenAI Responses and compatible APIs
  auth:
  - bearer-api-key
  - oauth-where-supported
  models: runtime-discovery
  capability_source: configuration-plus-tests
  capabilities:
  - text-input
  - image-input
  - file-input
  - text-output
  - structured-output
  - tools
  - streaming
  - citations
  - reasoning-summary
  - opaque-reasoning-state
  - prompt-cache
  - image-generation
  raw_response_policy: terminal-redacted
  data_policy:
    region_configurable: true
    tenant_credentials: optional-policy-gated
  notes: Use native provider semantics through the Rig adapter; do not assume every model supports every listed
    family capability.
