# Redacted reference configuration. Environment variables or a production
# secret injector provide all fields marked "<secret>".
[service]
name = "example-service"
environment = "development"
public_base_url = "http://localhost:8080"

[server]
public_bind = "0.0.0.0:8080"
admin_bind = "127.0.0.1:9090"
graceful_shutdown_timeout = "30s"
request_timeout = "30s"
header_timeout = "5s"
json_body_limit = "2MiB"
trusted_proxy_cidrs = []

[telemetry]
log_format = "pretty"
log_filter = "example_service=debug,tower_http=info"
otlp_enabled = false
otlp_endpoint = "http://localhost:4317"
# headers are injected separately as TELEMETRY__OTLP__HEADERS

[postgres]
# url is injected as EXAMPLE_SERVICE__POSTGRES__URL
tls_mode = "verify-full"
min_connections = 1
max_connections = 10
acquire_timeout = "5s"
connect_timeout = "10s"
idle_timeout = "10m"
max_lifetime = "30m"
max_lifetime_jitter = "5m"
application_name = "example-service"
initialization_sql = ["SET search_path TO public"]
statement_timeout = "15s"
lock_timeout = "3s"
health_timeout = "6s"
shutdown_timeout = "10s"

[postgres.transaction_retry]
max_attempts = 3
base_delay = "25ms"
max_delay = "1s"
max_jitter = "100ms"
isolation = "serializable"

[idempotency]
enabled = true
ttl = "24h"
max_response_bytes = 65536

[pagination]
# Inject exactly 32 secret bytes as EXAMPLE_SERVICE__PAGINATION__CURSOR_SIGNING_KEY.

[openapi]
document_route_enabled = true
docs_route_enabled = true # disable outside intended documentation environments
max_document_bytes = 4194304

[outbound_http]
connect_timeout = "5s"
total_timeout = "30s"
response_body_limit_bytes = 2097152
max_redirects = 5
user_agent = "example-service/0.1.0"

[outbound_http.proxy]
mode = "disabled"

[migrations]
run_on_startup = true # local/test only
operation_timeout = "15m"

[redis]
enabled = false
# url is injected as EXAMPLE_SERVICE__REDIS__URL
command_timeout = "2s"
key_prefix = "example:v1"

[http.cors]
allowed_origins = ["http://localhost:3000"]
allow_credentials = true

[auth.session]
enabled = true
store = "postgres"
cookie_name = "example_session" # production requires a Secure `__Host-` name
secure = false
http_only = true
same_site = "lax"
idle_timeout = "12h"
absolute_timeout = "30d"

[auth.jwt]
enabled = false
issuers = []
audiences = []
algorithms = ["RS256"]
token_types = ["at+jwt"]
clock_skew = "30s"
cache_ttl = "15m"
min_refresh_interval = "30s"
max_token_lifetime = "1h"
max_token_bytes = 16384
max_jwks_bytes = 262144
max_keys_per_issuer = 64
max_kid_bytes = 128

[auth.oidc]
enabled = false
providers = []
pending_flow_ttl = "5m"
link_proof_max_age = "5m"
response_body_limit_bytes = 262144

[auth.api_keys]
enabled = false
pepper = ""
max_scopes = 32
max_key_lifetime = "2160h"
last_used_write_interval = "5m"

[rate_limits.login]
burst = 5
replenish = "1m"
failure_mode = "closed"

[object_storage]
enabled = false
provider = "local"
local_root = "./var/objects"

[email]
enabled = false
transport = "capture"
template_root = "./templates/email"

[webhooks]
enabled = false
provider = "svix"

[jobs]
enabled = false
provider = "apalis-redis"
worker_concurrency = 16
shutdown_timeout = "25s"
