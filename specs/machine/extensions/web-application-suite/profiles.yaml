schema_version: 1.0.0
extension_version: 0.3.0
base_bundle_version: 0.3.0
profiles:
- id: web-sdk-only
  description: PostgreSQL API plus a framework-neutral TypeScript SDK whose application
    HTTP contract starts route-less; no served browser UI
  extends: api
  modules:
  - web-sdk-core
- id: web
  description: React/Vite readiness shell with auth SDK primitives and Axum static
    delivery; application routes and identity integration remain application-owned
  extends: authenticated-api
  modules:
  - web-sdk-core
  - web-react
  - web-auth
  - web-authorization
  - web-forms
  - web-static
- id: realtime-web
  description: React/Vite readiness shell with typed WebSocket and SSE SDK primitives;
    application synchronization remains application-owned
  extends: realtime
  modules:
  - web-sdk-core
  - web-react
  - web-auth
  - web-authorization
  - web-realtime
  - web-forms
  - web-static
- id: saas-web
  description: SaaS runtime plus a readiness shell and reusable realtime, upload, tenancy,
    feature, and form SDK primitives; product UI assembly remains application-owned
  extends: saas
  modules:
  - events-redis-ephemeral
  - realtime-core
  - sse
  - websockets
  - web-sdk-core
  - web-react
  - web-auth
  - web-authorization
  - web-realtime
  - web-uploads
  - web-feature-flags
  - web-tenancy
  - web-forms
  - web-static
- id: full-reference-web
  description: CI profile selecting every compatible backend and web library while
    leaving product browser composition application-owned
  extends: full-reference
  modules:
  - web-sdk-core
  - web-react
  - web-auth
  - web-authorization
  - web-realtime
  - web-uploads
  - web-feature-flags
  - web-tenancy
  - web-forms
  - web-local-state
  - web-static
