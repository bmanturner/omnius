schema_version: 1.0.0
extension_version: 0.2.0
base_bundle_version: 0.2.0
web_extension_version: 0.2.0
runtime_dependencies:
- kind: external
  id: configured-llm-provider-apis
  bindings:
  - name: OMNIUS__LLM__PROVIDER_ENDPOINT
    message: set the selected LLM provider endpoint
    credential: false
  - name: OMNIUS__LLM__PROVIDER_API_KEY
    message: set the selected LLM provider API key
    credential: true
- kind: external
  id: aws-bedrock-runtime
  bindings:
  - name: AWS_REGION
    message: set the AWS region for Bedrock Runtime
    credential: false
  - name: AWS_ACCESS_KEY_ID
    message: set the AWS access key ID for Bedrock Runtime
    credential: true
  - name: AWS_SECRET_ACCESS_KEY
    message: set the AWS secret access key for Bedrock Runtime
    credential: true
- kind: external
  id: google-vertex-ai
  bindings:
  - name: GOOGLE_CLOUD_PROJECT
    message: set the Google Cloud project for Vertex AI
    credential: false
  - name: GOOGLE_APPLICATION_CREDENTIALS
    message: set the Google application credentials path
    credential: true
