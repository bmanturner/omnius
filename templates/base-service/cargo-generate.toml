[template]
cargo_generate_version = ">=0.23.0"
include = [
  ".dockerignore",
  ".gitignore",
  ".omnius/**",
  "Cargo.toml",
  "README.md",
  "apps/**",
  "config/**",
  "crates/**",
  "docs/**",
  "ops/**",
]

[placeholders.profile]
type = "string"
prompt = "Service profile"
choices = [
  "minimal",
  "api",
  "authenticated-api",
  "oauth-provider",
  "saas",
  "saas-pgmq",
  "realtime",
  "realtime-durable",
  "worker",
  "full-reference",
  "full-reference-web",
  "realtime-web",
  "saas-web",
  "web",
  "web-sdk-only",
]
default = "minimal"
