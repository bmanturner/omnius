[workspace]
resolver = "3"
members = [
  "apps/service",
  "crates/service-kit",
  # rsk:managed-begin id=workspace-members version=1 hash=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
  # rsk:managed-end id=workspace-members
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["json", "query", "ws", "multipart"] }
http-body-util = "=0.1.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=1.1.4"
tower = { version = "=0.5.3", features = ["util", "timeout", "limit", "load-shed", "retry", "buffer"] }
# rsk:managed-begin id=workspace-dependencies version=1 hash=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
# rsk:managed-end id=workspace-dependencies

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
