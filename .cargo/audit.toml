[advisories]
# Owner: Security
# Applicability: rsa 0.9.10 is locked only through SQLx 0.8.6's disabled MySQL
# driver; no selected feature or target compiles it (`cargo tree --target all -i rsa`
# is empty). The PostgreSQL-only baseline contains no RSA operation.
# Mitigation: cargo-deny evaluates the active all-feature workspace graph; CI
# checks that rsa remains unreachable and removes this exception if it becomes
# active. See ADR-0012 and R-038.
# Expires: 2026-11-23
ignore = ["RUSTSEC-2023-0071"]

