[advisories]
# Owner: Security
# Applicability: rsa 0.9.10 is locked through SQLx's disabled MySQL driver and
# actively compiled by openidconnect 4.0.1 for provider-public-key verification.
# The OIDC adapter never supplies or operates on RSA private-key material.
# Mitigation: the active path is restricted to public verification; CI reports
# dependency reachability and rejects any additional/private-key use.
# See ADR-0012, ADR-0015, R-038, and R-039.
# Expires: 2026-11-23
ignore = ["RUSTSEC-2023-0071"]

