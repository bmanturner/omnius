name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce immutable action references
        run: ruby supply-chain/check-action-pins.rb
      - name: Reject unapproved secret and cryptographic material
        run: python3 supply-chain/check-material.py
      - name: Install verified gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${HOME}/.local/bin/gitleaks"
          "${HOME}/.local/bin/gitleaks" version | grep -Fx "${GITLEAKS_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Scan repository for secrets
        run: |
          set -euo pipefail
          gitleaks git --config supply-chain/gitleaks.toml --redact --no-banner \
            --ignore-gitleaks-allow --log-opts="--all --full-history --text" .
          gitleaks dir --config supply-chain/gitleaks.toml --redact --no-banner \
            --ignore-gitleaks-allow .

  policy:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure isolated Cargo home
        run: echo "CARGO_HOME=${RUNNER_TEMP}/t121-cargo-home" >> "${GITHUB_ENV}"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install pinned policy tools outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cargo install --locked cargo-deny@0.20.2
          cargo install --locked cargo-audit@0.22.2
          cargo install --locked cargo-vet@0.10.2
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
      - name: Enforce bounded advisory exception
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [[ "$(date -u +%F)" > "2026-11-23" ]]; then
            echo "bounded advisory exceptions expired" >&2
            exit 1
          fi
          rsa_paths="$(cargo tree --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml" --locked --target all -i rsa@0.9.10 --depth 2 --prefix none | sed -E 's/ \(.*\)$//' | sort -u)"
          expected_rsa_paths=$'openidconnect v4.0.1\nrsa v0.9.10\nrsk-auth-oidc v0.1.0\nrsk-phase0-compatibility v0.0.0'
          if [[ "${rsa_paths}" != "${expected_rsa_paths}" ]]; then
            echo "RUSTSEC-2023-0071 dependency path escaped ADR-0015" >&2
            cargo tree --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml" --locked --target all -i rsa@0.9.10
            exit 1
          fi
          lru_paths="$(cargo tree --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml" --locked --target all -i lru@0.16.4 --depth 2 --prefix none | sed -E 's/ \(.*\)$//' | sort -u)"
          expected_lru_paths=$'async-graphql v7.2.1\nlru v0.16.4\nrsk-authz-conformance v0.1.0\nrsk-graphql v0.1.0'
          if [[ "${lru_paths}" != "${expected_lru_paths}" ]]; then
            echo "RUSTSEC-2026-0253 dependency path escaped its bounded exception" >&2
            cargo tree --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml" --locked --target all -i lru@0.16.4
            exit 1
          fi
      - name: Check vulnerability database
        working-directory: ${{ runner.temp }}
        run: >-
          cargo audit
          --file "${GITHUB_WORKSPACE}/Cargo.lock"
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0253
          --deny warnings
      - name: Check advisories, licenses, sources, and dependency bans
        working-directory: ${{ runner.temp }}
        run: >-
          cargo deny
          --config "${GITHUB_WORKSPACE}/deny.toml"
          --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml"
          check advisories bans licenses sources
      - name: Check vetted dependency graph
        working-directory: ${{ runner.temp }}
        run: >-
          cargo vet
          --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml"
          --locked

  sbom-and-api:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure isolated Cargo home
        run: echo "CARGO_HOME=${RUNNER_TEMP}/artifact-cargo-home" >> "${GITHUB_ENV}"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install pinned artifact tools outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx@0.5.9
          cargo install --locked cargo-semver-checks@0.50.0
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
      - name: Generate CycloneDX 1.5 SBOMs
        working-directory: ${{ runner.temp }}
        run: >-
          cargo cyclonedx
          --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml"
          --format json
          --all-features
          --target all
          --spec-version 1.5
          --license-strict
          --license-accept-named BSD-3-Clause/MIT
          --license-accept-named Apache-2.0/MIT
          --license-accept-named "Apache-2.0 / MIT"
          --license-accept-named MIT/Apache-2.0
          --license-accept-named Unlicense/MIT
      - name: Validate SBOM documents
        run: |
          mapfile -d '' sboms < <(find . -name '*.cdx.json' -print0)
          test "${#sboms[@]}" -gt 0
          for sbom in "${sboms[@]}"; do
            jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5"' "$sbom" >/dev/null
          done
      - name: Check public API compatibility
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          if cargo metadata --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml" --no-deps --format-version 1 | jq -e '[.packages[] | select(.publish == null)] | length > 0' >/dev/null; then
            baseline="${GITHUB_BASE_REF:-main}"
            cargo semver-checks --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml" --workspace --baseline-rev "origin/${baseline}"
          else
            echo "No publishable workspace crates; semantic compatibility gate is not applicable yet."
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sboms
          path: "**/*.cdx.json"
          if-no-files-found: error
