name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143
      - run: python3 -m pip install --requirement specs/tools/requirements.txt
      - run: python3 specs/tools/validate_bundle.py specs
      - run: python3 specs/tools/validate_web_feature_suite.py specs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo check --workspace --all-targets
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc
      - run: cargo test -p xtask
      - run: cargo xtask profiles verify
      - run: cargo xtask specs verify
      - run: cargo xtask contracts check
      - if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git cat-file -e "origin/${GITHUB_BASE_REF}:contracts/contract-manifest.json"; then
            cargo xtask contracts diff --against "origin/${GITHUB_BASE_REF}"
          else
            echo "No baseline contract set on base branch; skipping first-introduction diff"
          fi

  web-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm licenses list --json
      - run: pnpm w0:generate
      - run: git diff --exit-code -- compat/web-w0/generated/client.ts
      - run: pnpm w0:typecheck
      - run: pnpm w0:typecheck:ts7
      - run: pnpm w0:test
      - run: pnpm w0:build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm w0:test:e2e

  web-release-gates:
    runs-on: ubuntu-latest
    env:
      OMNIUS_E2E_API_BIN: target/debug/omnius-api-server
      OMNIUS_E2E_POSTGRES_URL: postgres://omnius_e2e:omnius-e2e-password@127.0.0.1:5432/omnius_e2e
    services:
      postgres:
        image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: omnius_e2e
          POSTGRES_USER: omnius_e2e
          POSTGRES_PASSWORD: omnius-e2e-password
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnius_e2e -d omnius_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: cargo build --locked --bin omnius-api-server
      - run: pnpm web:build
      - run: pnpm web:typecheck:e2e
      - run: pnpm web:test:release-config
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm web:test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-release-gate-failures
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  web-profile-matrix:
    runs-on: ubuntu-latest
    env:
      OMNIUS_RELEASE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      OMNIUS_RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: cargo xtask profiles generate-verify --jobs 2
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-profile-matrix
          path: |
            target/profile-matrix/report.json
            target/profile-matrix/work/*/web/playwright-report
            target/profile-matrix/work/*/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  sqlx-metadata:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/reference
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reference"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6
      - run: cargo sqlx migrate run --source migrations
      - run: cargo sqlx prepare --check --workspace -- --package omnius-reference-postgres --package omnius-idempotency --all-targets
