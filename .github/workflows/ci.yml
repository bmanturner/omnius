name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143
      - run: python3 -m pip install --requirement specs/tools/requirements.txt
      - run: python3 specs/tools/validate_bundle.py specs
      - run: python3 specs/tools/validate_web_feature_suite.py specs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo check --workspace --all-targets
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc
      - run: cargo test -p xtask
      - run: cargo xtask profiles verify
      - run: cargo xtask specs verify
      - run: cargo xtask openapi verify
      - if: github.event_name == 'pull_request'
        shell: bash
        run: |
          baseline="$(mktemp)"
          if git show "origin/${GITHUB_BASE_REF}:contracts/openapi.json" > "${baseline}"; then
            cargo xtask openapi breaking "${baseline}"
          else
            echo "No baseline OpenAPI document on base branch; skipping first-introduction diff"
          fi

  web-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm licenses list --json
      - run: pnpm w0:generate
      - run: git diff --exit-code -- compat/web-w0/generated/client.ts
      - run: pnpm w0:typecheck
      - run: pnpm w0:typecheck:ts7
      - run: pnpm w0:test
      - run: pnpm w0:build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm w0:test:e2e

  sqlx-metadata:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/reference
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reference"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6
      - run: cargo sqlx migrate run --source migrations
      - run: cargo sqlx prepare --check --workspace -- --package omnius-reference-postgres --package omnius-idempotency --all-targets
